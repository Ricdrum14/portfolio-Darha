<section class="min-h-screen bg-[#fdfaf6] py-36 px-4 flex justify-center items-start font-serif">
    <div class="w-full max-w-xl">
      <!-- Lien retour -->
      <a
        routerLink=""
        routerLinkActive="underline"
        class="relative z-10 text-sm text-gray-500 hover:underline mb-4 inline-block transition duration-200"
      >
        ← Retour à l’accueil
      </a>
  
      <!-- Formulaire -->
      <form
        (ngSubmit)="sendEmail()"
        #contactForm="ngForm"
        class="bg-white p-8 rounded-xl shadow-md text-gray-900 space-y-6"
        novalidate
      >
        <h2 class="text-3xl font-semibold mb-6 text-center">Contact</h2>
  
        <!-- Nom -->
        <div>
          <label for="name" class="block mb-1 font-medium">Nom</label>
          <input
            type="text"
            id="name"
            name="user_name"
            [(ngModel)]="formData.name"
            required
            maxlength="50"
            pattern="^[a-zA-ZÀ-ÿ \-']{2,50}$"
            placeholder="Votre nom"
            class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-900"
          />
        </div>
  
        <!-- Email -->
        <div>
          <label for="email" class="block mb-1 font-medium">Email</label>
          <input
            type="email"
            id="email"
            name="user_email"
            [(ngModel)]="formData.email"
            required
            maxlength="100"
            placeholder="votremail@example.com"
            class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-900"
          />
        </div>
  
        <!-- Message -->
        <div>
          <label for="message" class="block mb-1 font-medium">Message</label>
          <textarea
            id="message"
            name="message"
            [(ngModel)]="formData.message"
            required
            minlength="10"
            maxlength="1000"
            placeholder="Votre message ici..."
            rows="6"
            class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-900"
          ></textarea>
        </div>
  
        <!-- Bouton -->
        <div class="text-center">
          <button
            type="submit"
            [disabled]="!contactForm.form.valid"
            class="px-6 py-2 rounded-full font-semibold bg-gray-900 text-white hover:bg-gray-800 transition-all shadow-lg hover:scale-105"
          >
            Envoyer
          </button>
        </div>
      </form>
  
        <!-- 🌐 Icônes réseaux sociaux -->
        <div class="mt-8 flex justify-center gap-6 text-gray-700 text-xl">
        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/in/ricardo-annis-877986291/" target="_blank" rel="noopener"
        class="hover:text-gray-900 transition duration-300">
        <i class="fab fa-linkedin"></i>
        </a>
    
        <!-- Instagram -->
        <a href="https://www.instagram.com/tonprofil" target="_blank" rel="noopener"
        class="hover:text-gray-900 transition duration-300">
        <i class="fab fa-instagram"></i>
        </a>
    </div>
  
    </div>
  </section>
